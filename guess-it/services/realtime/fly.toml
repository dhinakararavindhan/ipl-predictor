# Fly.io config — deploy from the guess-it/ directory:
#   cd guess-it && fly launch --copy-config --no-deploy && fly deploy
app = "guessit-realtime"
primary_region = "bom"

[build]
  dockerfile = "services/realtime/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
