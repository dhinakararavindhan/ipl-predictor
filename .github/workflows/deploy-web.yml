name: deploy-web

on:
  push:
    branches: [main, 'claude/guess-it-platform-brd-144tws']
    paths: ['guess-it/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guess-it/apps/web/package-lock.json
      - run: npm ci
        working-directory: guess-it/apps/web
      - run: npm run build
        working-directory: guess-it/apps/web
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /ipl-predictor
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guess-it/apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
