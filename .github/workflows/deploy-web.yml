name: deploy-web

on:
  push:
    branches: [main, 'claude/guess-it-platform-brd-144tws']
    paths: ['guess-it/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

# contents: read is enough now — we deploy via the Pages artifact flow, and
# configure-pages (enablement: true) creates the Pages site on first run so
# no manual Settings → Pages toggle is needed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guess-it/apps/web/package-lock.json
      - name: Enable GitHub Pages (first run only)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
        working-directory: guess-it/apps/web
      - run: npm run build
        working-directory: guess-it/apps/web
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /ipl-predictor
          # Live Race / Quick Match / Party: set repo variable REALTIME_URL to
          # wss://<your-realtime-host>/ws once the server is deployed
          # (guess-it/DISTRIBUTION.md). Empty = features show a friendly
          # "server not connected" note.
          NEXT_PUBLIC_REALTIME_URL: ${{ vars.REALTIME_URL || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guess-it/apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
