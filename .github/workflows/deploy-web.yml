name: deploy-web

on:
  push:
    branches: [main, 'claude/guess-it-platform-brd-144tws']
    paths: ['guess-it/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guess-it/apps/web/package-lock.json
      - run: npm ci
        working-directory: guess-it/apps/web
      - run: npm run build
        working-directory: guess-it/apps/web
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /ipl-predictor
          # Live Race / Quick Match / Party: set repo variable REALTIME_URL to
          # wss://<your-realtime-host>/ws once the server is deployed
          # (guess-it/DISTRIBUTION.md). Empty = features show a friendly
          # "server not connected" note.
          NEXT_PUBLIC_REALTIME_URL: ${{ vars.REALTIME_URL || '' }}
      # Publish the static site to the gh-pages branch. One-time owner step to
      # go live (workflow tokens cannot create the Pages site — that needs
      # repo admin): Settings → Pages → Deploy from a branch → gh-pages → /.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: guess-it/apps/web/out
          commit_message: 'Deploy GUESS IT ${{ github.sha }}'
