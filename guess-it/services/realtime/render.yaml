# Render.com blueprint — free tier works for the beta.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: guessit-realtime
    runtime: docker
    rootDir: guess-it
    dockerfilePath: services/realtime/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: AUTH_SECRET
        generateValue: true
      # For real persistence across deploys, attach a free Postgres
      # (Neon/Supabase) and set DATABASE_URL here; otherwise scores live in a
      # JSON file that resets when the instance is rebuilt.
      # - key: DATABASE_URL
      #   sync: false
