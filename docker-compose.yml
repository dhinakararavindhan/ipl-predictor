# The Stands — multi-service stack
#
#   docker compose up            # web + all workers
#   npx supabase start           # the data platform (auth/db/realtime) runs
#                                # via the Supabase CLI's own compose stack
#
# Put real values in .env (compose reads it automatically).
#
# Pipeline: fixtures-sync (upstream) writes matches; database triggers emit
# domain events; notifier + trends (downstream) consume the bus and write
# fan inboxes and match aggregates that the web app reads.

x-worker-env: &worker-env
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CRON_SECRET: ${CRON_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

  fixtures-sync:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
      args: { SERVICE: fixtures-sync }
    environment:
      <<: *worker-env
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
      FOOTBALL_DATA_COMPETITIONS: ${FOOTBALL_DATA_COMPETITIONS:-PL}
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
      args: { SERVICE: notifier }
    environment:
      <<: *worker-env
      NOTIFY_INTERVAL_SECONDS: ${NOTIFY_INTERVAL_SECONDS:-30}
    restart: unless-stopped

  trends:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
      args: { SERVICE: trends }
    environment:
      <<: *worker-env
      TRENDS_INTERVAL_SECONDS: ${TRENDS_INTERVAL_SECONDS:-60}
    restart: unless-stopped

  push-delivery:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
      args: { SERVICE: push-delivery }
    environment:
      <<: *worker-env
      PUSH_INTERVAL_SECONDS: ${PUSH_INTERVAL_SECONDS:-20}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    restart: unless-stopped
